---

### 5. `.github/workflows/build.yml`
Uses `macos-latest` with Theos and Xcode to compile the rootful `.deb` (`iphoneos-arm`) and upload it as a downloadable artifact.

```yaml
name: Build Rootful iOS 14 Deb

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies (ldid, dpkg, fakeroot)
        run: |
          brew install ldid dpkg fakeroot

      - name: Clone Theos & iOS 14.5 SDK
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          curl -L https://github.com/theos/sdks/archive/master.zip -o sdks.zip
          unzip -q sdks.zip
          mkdir -p $HOME/theos/sdks
          cp -r sdks-master/iPhoneOS14.5.sdk $HOME/theos/sdks/

      - name: Build .deb Package
        env:
          THEOS: ${{ runner.home }}/theos
          THEOS_PACKAGE_SCHEME: ""
        run: |
          make clean package FINALPACKAGE=1

      - name: Upload .deb Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TikTokLiveFakeCam-iOS14-Rootful
          path: packages/*.deb
